<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan to Check In — Immaculata-La Salle High School</title>
<link rel="icon" href="assets/crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="assets/qrcode.min.js"></script>
<style>
  :root {
    --green: #004B23;
    --green-mid: #0a6b38;
    --gold: #FFC20E;
    --gray-600: #4b5563;
    --gray-400: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--green);
    background-image: radial-gradient(ellipse at 20% 15%, rgba(255,194,14,.16) 0%, transparent 55%),
                       radial-gradient(ellipse at 85% 90%, rgba(255,194,14,.10) 0%, transparent 55%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    background: #ffffff;
    border-radius: 28px;
    padding: 48px 44px 40px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: 0 30px 90px rgba(0,0,0,.35);
  }
  .crest {
    width: 76px; height: 76px;
    margin: 0 auto 14px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--gold);
    box-shadow: 0 6px 20px rgba(0,75,35,.3);
  }
  .crest img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .org { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: var(--green); }
  .event { font-size: 12.5px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
  .headline {
    font-family: 'Poppins', sans-serif;
    font-size: 26px; font-weight: 700; color: var(--green);
    margin: 26px 0 6px;
  }
  .subhead { font-size: 14.5px; color: var(--gray-600); margin-bottom: 26px; line-height: 1.5; }
  #qr-wrap {
    display: flex;
    justify-content: center;
    padding: 16px;
    background: #ffffff;
    border-radius: 20px;
    border: 1.5px solid #eef1ee;
  }
  #qr-wrap svg { width: 100%; max-width: 360px; height: auto; }
  .url-note {
    margin-top: 22px;
    font-size: 12.5px;
    color: var(--gray-400);
  }
  .url-note strong { color: var(--gray-600); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="crest"><img src="assets/crest.png" alt="Immaculata-La Salle High School crest"></div>
    <div class="org">Immaculata-La Salle High School</div>
    <div class="event">Open House</div>
    <div class="headline">Scan to Check In</div>
    <div class="subhead">Point your phone's camera at the code below to find your registration and check in.</div>
    <div id="qr-wrap"></div>
    <div class="url-note">Or visit <strong id="url-text"></strong></div>
  </div>

<script>
const CHECKIN_URL = window.location.origin + window.location.pathname.replace(/qr\.html$/, "checkin.html");
document.getElementById('url-text').textContent = CHECKIN_URL;

function renderQrWithLogo(containerId, data, logoHref) {
  const qr = qrcode(0, 'H'); // high error correction — tolerates the center logo
  qr.addData(data);
  qr.make();

  const moduleCount = qr.getModuleCount();
  const cellSize = 10;
  const margin = 3;
  const qrSize = moduleCount * cellSize;
  const size = qrSize + margin * 2 * cellSize;

  let modules = '';
  for (let r = 0; r < moduleCount; r++) {
    for (let c = 0; c < moduleCount; c++) {
      if (qr.isDark(r, c)) {
        modules += `<rect x="${(c + margin) * cellSize}" y="${(r + margin) * cellSize}" width="${cellSize}" height="${cellSize}"/>`;
      }
    }
  }

  const logoFrac = 0.22;
  const logoSize = qrSize * logoFrac;
  const logoPos = margin * cellSize + (qrSize - logoSize) / 2;
  const padSize = logoSize * 1.2;
  const padPos = margin * cellSize + (qrSize - padSize) / 2;

  document.getElementById(containerId).innerHTML = `
    <svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR code linking to the Open House check-in page">
      <rect width="${size}" height="${size}" fill="#ffffff"/>
      <g fill="#004B23">${modules}</g>
      <rect x="${padPos}" y="${padPos}" width="${padSize}" height="${padSize}" rx="${padSize * 0.16}" fill="#ffffff" stroke="#004B23" stroke-width="2.5"/>
      <image href="${logoHref}" x="${logoPos}" y="${logoPos}" width="${logoSize}" height="${logoSize}" />
    </svg>`;
}

renderQrWithLogo('qr-wrap', CHECKIN_URL, 'assets/crest-mark.png');
</script>
</body>
</html>
